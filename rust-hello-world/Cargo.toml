[package]
name = "rein-hello-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Chapter 04: the Part 1 Hello World assistant's model-independent behavior in Rust"

# A standalone teaching crate, deliberately outside the product workspace in the repository root.
[workspace]

[[bin]]
name = "rein-hello"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
