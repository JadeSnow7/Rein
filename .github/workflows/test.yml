name: Test code

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'ts/**'
      - 'rust/**'
      - 'contracts/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'ts/**'
      - 'rust/**'
      - 'contracts/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r python/part1/requirements.txt
      - name: Test Python part 1
        run: python -m unittest discover -s python/part1/tests -v

  ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect TypeScript sources
        id: detect
        run: |
          if [ -n "$(find ts/src ts/tests -name '*.ts' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ts/ 尚无 TypeScript 源码，跳过类型检查与测试。"
          fi
        shell: bash
      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --locked
